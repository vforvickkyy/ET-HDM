name: Engine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y hfsprogs xorriso zlib1g-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j

      - name: Engine tests
        run: bash tests/engine/run_tests.sh build/tools/ehfs-cli/ehfs work

      - name: Keep fixtures for the Windows job
        run: |
          mkdir fixtures
          cp work/{tree.iso,gpt.img,gpt4k.img,mbr.img,dirty.img,manifest.txt} fixtures/

      - uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: fixtures
          retention-days: 3

  windows:
    name: Windows build and checks
    runs-on: windows-2022
    needs: linux
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEHFS_BUILD_TESTS=OFF
          cmake --build build

      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: fixtures

      - name: Check fixtures with the native Windows build
        run: python tests/engine/check_fixtures.py build/tools/ehfs-cli/ehfs.exe fixtures

      - uses: actions/upload-artifact@v4
        with:
          name: ehfs-windows-x64
          path: build/tools/ehfs-cli/ehfs.exe
